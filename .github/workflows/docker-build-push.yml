name: Docker Build and Push (reusable)

on:
  workflow_call:
    inputs:
      image-name:
        description: "Image path after the registry, lowercase, for example thormie-harshey/orders-api"
        type: string
        required: true
      registry:
        description: "Registry host, for example ghcr.io or docker.io"
        type: string
        required: false
        default: "ghcr.io"
      registry-username:
        description: "Username for the registry login"
        type: string
        required: true
    secrets:
      registry_password:
        description: "Password or token for the registry login"
        required: true
    outputs:
      image:
        description: "Full image reference tagged with the commit SHA"
        value: ${{ jobs.build-push.outputs.image }}
      digest:
        description: "Unchangeable sha256 digest of the pushed image"
        value: ${{ jobs.build-push.outputs.digest }}

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.ref.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Work out image reference
        id: ref
        env:
          REGISTRY: ${{ inputs.registry }}
          IMAGE_NAME: ${{ inputs.image-name }}
        run: echo "image=${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry-username }}
          password: ${{ secrets.registry_password }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ref.outputs.image }}
